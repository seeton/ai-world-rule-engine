name: Request Copilot review

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to request Copilot review for
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: request-copilot-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  request-copilot-review:
    name: Request Copilot code review
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.draft == false
    steps:
      - name: Request Copilot as reviewer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          set -euo pipefail

          if [ -z "${PR_NUMBER}" ]; then
            echo "::error::PR_NUMBER was not resolved."
            exit 1
          fi

          echo "Checking current review requests for PR #${PR_NUMBER}."

          gh pr view "${PR_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json reviewRequests \
            --jq '.reviewRequests[].login' > /tmp/requested-reviewers.txt

          if grep -Fxiq "copilot" /tmp/requested-reviewers.txt; then
            echo "Copilot review is already requested."
            exit 0
          fi

          echo "Requesting Copilot code review for PR #${PR_NUMBER}."

          if gh pr edit "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --add-reviewer "@copilot"; then
            echo "Copilot code review requested."
          else
            echo "::warning::Could not request Copilot code review. Confirm repository/user Copilot review settings and reviewer-request permissions."
          fi

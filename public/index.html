<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Village PoC</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="scene-panel">
        <div class="scene-header">
          <div>
            <p class="eyebrow">AI Village PoC</p>
            <h1>棒人間の村人と話す</h1>
            <p id="mode-detail" class="mode-detail">Codex 状態を確認中...</p>
          </div>
          <span id="mode-badge" class="mode-badge">読み込み中...</span>
        </div>

        <div class="scene">
          <div class="sun"></div>
          <div class="cloud cloud-left"></div>
          <div class="cloud cloud-right"></div>
          <div class="house">
            <div class="roof"></div>
            <div class="body"></div>
            <div class="door"></div>
          </div>

          <div class="villager-wrap">
            <div id="speech-bubble" class="speech-bubble">やあ。私はこの村の最初の住民だよ。</div>
            <div class="stickman" aria-hidden="true">
              <div class="head"></div>
              <div class="body-line body"></div>
              <div class="body-line arm arm-left"></div>
              <div class="body-line arm arm-right"></div>
              <div class="body-line leg leg-left"></div>
              <div class="body-line leg leg-right"></div>
            </div>
            <p id="villager-name" class="villager-name">村人</p>
          </div>
        </div>
      </section>

      <section class="chat-panel">
        <div id="chat-log" class="chat-log" aria-live="polite"></div>

        <form id="chat-form" class="chat-form">
          <label class="sr-only" for="chat-input">メッセージ</label>
          <textarea
            id="chat-input"
            name="message"
            rows="3"
            maxlength="500"
            placeholder="例: この村に何を作ろうか？"
            required
          ></textarea>
          <button id="send-button" type="submit">話しかける</button>
        </form>
      </section>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
